name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x makeitreal-app/gradlew

      - name: Build Android Debug APK
        run: |
          cd makeitreal-app
          ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp makeitreal-app/composeApp/build/outputs/apk/debug/composeApp-debug.apk release-assets/MakeItReal-debug.apk

      - name: Upload Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakeItReal-debug-apk
          path: release-assets/MakeItReal-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: preview-apk
          name: "MakeItReal Android Preview Build"
          body: |
            ## 📱 MakeItReal Android 手机安装包 (Debug Preview)

            - **构建触发**：${{ github.event_name }}
            - **最新提交**：`${{ github.sha }}`
            - **安装说明**：手机自带浏览器打开此页面，点击下方 `MakeItReal-debug.apk` 下载，下载完成后点击即可直接安装。

            > 💡 **安装提示**：Android 手机首次安装可能会弹出“来自未知来源应用”安全拦截，在设置中勾选“允许本次安装”即可正常体验。
          files: release-assets/MakeItReal-debug.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
