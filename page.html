      window.__APP_BOOTED__ = false;
      window.__APP_BOOT_START__ = Date.now();
      (function () {
        var TIMEOUT_MS = 15000;
        var DB_NAME = 'Database_ak';
        var STORE = 'Statistical_ak';

        function reportLoadFailed() {
          var root = document.getElementById('root');
          var now = Date.now();
          var detail = {
            type: 'sourceError',
            readyState: document.readyState,
            hasRoot: !!root,
            rootChildCount: root ? root.childElementCount : 0,
            hasModuleScript: !!document.querySelector('script[type="module"]'),
            elapsedMs: now - window.__APP_BOOT_START__,
            ts: now,

          var req = indexedDB.open(DB_NAME);
          req.onsuccess = function () {
            var db = req.result;
            try {
              if (!db.objectStoreNames.contains(STORE)) {
                db.close();
                return;
              }
              var key = 'load_failed_' + now + '_' + Math.random().toString(36).slice(2, 8);
              var tx = db.transaction([STORE], 'readwrite');
              tx.objectStore(STORE).put(
                {
                  pageId: key,
                  createTime: now,
                  updateTime: now,
                  isClose: true,
                  data: [
                    {
                      name: 'perf_blank_screen',
                      params: detail,
                      properties: { event_time: Math.floor(now / 1000) },
                    },
                  ],
                },
                key,
              );
              tx.oncomplete = function () {
                db.close();
              };
              tx.onerror = function () {
                db.close();
              };
            } catch (e) {
              db.close();
            }
          };
          req.onerror = function () {};
        }

        setTimeout(function () {
          if (!window.__APP_BOOTED__) reportLoadFailed();
        }, TIMEOUT_MS);
      })();
